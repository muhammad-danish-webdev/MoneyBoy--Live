<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect Stable Scroll Layout</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #000;
        color: #fff;
        height: 100vh;
        overflow: hidden;
      }

      .search-content-wrapper-container {
        display: flex;
        height: 100vh;
        width: 100%;
      }

      /* 1. Main Scroll Logic */
      .scroll-section {
        height: 100vh;
        overflow-y: auto;
        /* Yeh property hamesha jagah reserve rakhegi (This will always reserve space) */
        scrollbar-gutter: stable;
        transition: scrollbar-color 0.3s ease;
      }

      /* 2. Custom Scrollbar Styling (Transparent by default) */
      .scroll-section::-webkit-scrollbar {
        width: 8px;
      }

      .scroll-section::-webkit-scrollbar-thumb {
        /* Normal halat mein transparent (Transparent in normal state) */
        background-color: rgba(68, 68, 68, 0);
        border-radius: 10px;
        transition: background-color 0.3s ease;
      }

      /* 3. Jab scrolling class add hogi tab color nazar aayega (Color shows when class is added) */
      .scroll-section.is-scrolling::-webkit-scrollbar-thumb {
        background-color: rgba(68, 68, 68, 1); /* Dark grey on scroll */
      }

      /* 4. Layout Styling */
      .search-page-aside-bar-section {
        width: 400px;
        background-color: #121212;
        flex-shrink: 0;
        border-right: 1px solid #222;
        padding: 20px;
      }

      .search-main-cards-section {
        flex: 1;
        background-color: #000;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }

      .search-spotlight-featured-sidebar {
        width: 300px;
        background-color: #121212;
        flex-shrink: 0;
        border-left: 1px solid #222;
        padding: 20px;
      }

      .content-box {
        height: 200px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="search-content-wrapper-container">
      <aside class="search-page-aside-bar-section scroll-section">
        <h2>Sidebar</h2>
        <div class="content-box"></div><div class="content-box"></div
        ><div class="content-box"></div> <div class="content-box"></div
        ><div class="content-box"></div>
      </aside>

      <main class="search-main-cards-section scroll-section">
        <div class="content-box"></div><div class="content-box"></div
        ><div class="content-box"></div> <div class="content-box"></div
        ><div class="content-box"></div><div class="content-box"></div>
      </main>

      <aside class="search-spotlight-featured-sidebar scroll-section">
        <h2>Featured</h2>
        <div class="content-box"></div><div class="content-box"></div
        ><div class="content-box"></div> <div class="content-box"></div
        ><div class="content-box"></div>
      </aside>
    </div>

    <script>
      const scrollSections = document.querySelectorAll(".scroll-section");

      scrollSections.forEach((section) => {
        let isScrolling;
        section.addEventListener("scroll", () => {
          section.classList.add("is-scrolling");
          window.clearTimeout(isScrolling);
          isScrolling = setTimeout(() => {
            section.classList.remove("is-scrolling");
          }, 800);
        });
      });
    </script>
  </body>
</html>
