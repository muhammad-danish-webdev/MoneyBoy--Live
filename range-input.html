<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Independent Scroll Layout</title>
    <style>
      /* 1. Global Resets */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #1a1a1a;
        color: white;
        /* Poori screen ko lock karne ke liye (To lock the full screen) */
        height: 100vh;
        overflow: hidden;
      }

      /* 2. Main Wrapper */
      .search-content-wrapper-container {
        display: flex;
        height: 100vh; /* Viewport height */
        width: 100%;
      }

      /* 3. Independent Scroll Styling */
      .scrollable-section {
        height: 100vh;
        overflow-y: auto; /* Sirf scroll tab aye jab content zyada ho */
        padding: 20px;
      }

      /* Custom Scrollbar for better look */
      .scrollable-section::-webkit-scrollbar {
        width: 5px;
      }
      .scrollable-section::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 10px;
      }

      /* 4. Left Sidebar (Fixed Width) */
      .search-page-aside-bar-section {
        width: 250px;
        background-color: #222;
        flex-shrink: 0;
        border-right: 1px solid #333;
      }

      /* 5. Main Content (Fluid) */
      .search-main-cards-section {
        flex: 1;
        background-color: #111;
      }

      /* 6. Right Sidebar (20% Width) */
      .search-spotlight-featured-sidebar {
        width: 20%;
        background-color: #222;
        flex-shrink: 0;
        border-left: 1px solid #333;
      }

      /* Dummy Content for Scrolling */
      .content-box {
        height: 200px;
        background: #333;
        margin-bottom: 20px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      h2 {
        margin-bottom: 20px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="search-content-wrapper-container">
      <aside class="search-page-aside-bar-section scrollable-section">
        <h2>Left Sidebar</h2>
        <div class="content-box">Link 1</div>
        <div class="content-box">Link 2</div>
        <div class="content-box">Link 3</div>
        <div class="content-box">Link 4</div>
        <div class="content-box">Link 5</div>
        <div class="content-box">Link 6</div>
      </aside>

      <main class="search-main-cards-section scrollable-section">
        <h2>Main Content Area</h2>
        <div class="content-box">Post 1</div>
        <div class="content-box">Post 2</div>
        <div class="content-box">Post 3</div>
        <div class="content-box">Post 4</div>
        <div class="content-box">Post 5</div>
        <div class="content-box">Post 6</div>
      </main>

      <aside class="search-spotlight-featured-sidebar scrollable-section">
        <h2>Right Sidebar</h2>
        <div class="content-box">Ad 1</div>
        <div class="content-box">Ad 2</div>
        <div class="content-box">Ad 3</div>
        <div class="content-box">Ad 4</div>
        <div class="content-box">Ad 5</div>
        <div class="content-box">Ad 6</div>
      </aside>
    </div>
  </body>
</html>
