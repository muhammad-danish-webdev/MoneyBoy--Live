<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clickable SVG Heart Icon</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #1a1a1a;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      /* Heart Icon Wrapper Styling */
      .heart-container {
        width: 100px; /* Container ki width */
        height: 100px; /* Container ki height */
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        background-color: #333; /* Background for visibility */
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      /* SVG Heart Styling */
      .heart-icon {
        width: 60px; /* SVG ki actual width */
        height: 60px; /* SVG ki actual height */
        fill: #ccc; /* Default Grey color */
        stroke: #999; /* Border color */
        stroke-width: 2px;
        transform-origin: center; /* Scale center se ho */
        transition:
          fill 0.3s ease,
          transform 0.1s ease-out; /* Smooth transitions */
      }

      /* Jab heart par mouse hover kare (Optional) */
      .heart-container:hover .heart-icon {
        fill: #e0e0e0;
        stroke: #bbb;
      }

      /* === Click Logic (No JS) === */
      /* Jab heart ko click karein tab yeh styles apply honge */
      .heart-container:active .heart-icon {
        fill: #ff0000; /* Red color on click */
        transform: scale(0.8); /* Scale down to 80% on click */
        stroke: #cc0000; /* Darker red border */
      }

      /* Text for demonstration */
      p {
        position: absolute;
        bottom: 20px;
        color: #888;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="heart-container">
      <svg class="heart-icon" viewBox="0 0 24 24">
        <path
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>
    </div>
    <p>Click the heart icon!</p>
  </body>
</html>
