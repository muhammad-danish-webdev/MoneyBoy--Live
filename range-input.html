<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logic Tester</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        padding: 50px;
        background: #f4f4f4;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 300px;
      }
      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }
      #result {
        margin-top: 15px;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Ticket Calculator</h3>
      <input type="number" id="ageInput" placeholder="Enter your age" />
      <button onclick="calculatePrice()">Check Price</button>
      <div id="result"></div>
    </div>

    <script>
      function calculatePrice() {
        const age = document.getElementById("ageInput").value;
        const display = document.getElementById("result");
        let price = 1000; // Base price

        // 1. Multiple "if" (Checking multiple independent conditions)
        // Yeh har condition check karega, chahe upar wali sahi ho ya nahi.
        if (age < 18) {
          price -= 200; // Minor discount
        }
        if (age > 60) {
          price -= 300; // Senior discount
        }

        // 2. "if-else" (Choosing only one path)
        // Is mein sirf ek hi block chalega.
        let category = "";
        if (age < 13) {
          category = "Child";
        } else if (age < 20) {
          category = "Teenager";
        } else {
          category = "Adult";
        }

        display.innerHTML = `Category: ${category} <br> Final Price: Rs. ${price}`;
      }
    </script>
  </body>
</html>
