<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Explanation</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 20px;
      }

      h2 {
        text-align: center;
        color: #333;
      }

      /* The Grid Container */
      .container {
        display: grid;
        /* This is the magic line */
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }

      /* Grid Items (Cards) */
      .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        border-top: 5px solid #007bff;
      }

      .card h3 {
        margin: 0;
        color: #007bff;
      }

      .card p {
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h2>Amina & Rizwan's Gallery Project</h2>
    <p style="text-align: center">Resize the window to see the magic!</p>

    <div class="container">
      <div class="card"><h3>Card 1</h3><p>I am at least 280px wide.</p></div>
      <div class="card"><h3>Card 2</h3><p>I stretch to fill the space.</p></div>
      <div class="card"><h3>Card 3</h3><p>I wrap automatically.</p></div>
      <div class="card"><h3>Card 4</h3><p>No media queries needed!</p></div>
      <div class="card"><h3>Card 5</h3><p>Perfect for portfolios.</p></div>
      <div class="card"><h3>Card 6</h3><p>Try shrinking your screen.</p></div>
    </div>
  </body>
</html>
