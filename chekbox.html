<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smooth Scroll Project</title>
    <style>
      /* ASLI JADU YAHAN HAI (The real magic is here) */
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #111;
        color: white;
      }

      /* Fixed Navigation Menu */
      nav {
        position: fixed;
        top: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.8);
        padding: 15px 0;
        display: flex;
        justify-content: center;
        z-index: 1000;
        border-bottom: 1px solid #333;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin: 0 20px;
        font-weight: bold;
        transition: color 0.3s;
      }

      nav a:hover {
        color: #ff4757;
      }

      /* Sections Styling */
      section {
        height: 100vh; /* Har section screen ki poori height lega */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-bottom: 2px solid #222;
      }

      h1 {
        font-size: 4rem;
        margin: 0;
      }

      p {
        font-size: 1.2rem;
        color: #888;
      }

      /* Different backgrounds for visual distinction */
      #home {
        background-color: #1a1a1a;
      }
      #about {
        background-color: #2f3542;
      }
      #services {
        background-color: #2ed573;
        color: black;
      }
      #contact {
        background-color: #3742fa;
      }

      /* Back to top button */
      .back-to-top {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #ff4757;
        color: white;
        padding: 10px 15px;
        border-radius: 50px;
        text-decoration: none;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>

    <section id="home">
      <h1>Welcome Home</h1>
      <p>Click the links above to see smooth scrolling.</p>
    </section>

    <section id="about">
      <h1>About Us</h1>
      <p>We build smooth web experiences.</p>
    </section>

    <section id="services">
      <h1>Our Services</h1>
      <p>Performance, GPU, and Clean UI.</p>
    </section>

    <section id="contact">
      <h1>Contact Now</h1>
      <p>Feel free to reach out to us.</p>
    </section>

    <a href="#home" class="back-to-top">↑ Top</a>
  </body>
</html>
